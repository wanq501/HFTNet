# HFTNet: DIFI with gated window attention (AIFI_DF) and DFAL aggregation nodes (DFAL2, RepNCSPELAN4 followed by a zero-initialized DFBN); train with --box-loss soiou --qs-target inner
# Ultralytics YOLO 🚀, AGPL-3.0 license
# RT-DETR-l object detection model with P3-P5 outputs. For details see https://docs.ultralytics.com/models/rtdetr
 
# Parameters
nc: 80  # number of classes
scales: # model compound scaling constants, i.e. 'model=yolov8n-cls.yaml' will call yolov8-cls.yaml with scale 'n'
  # [depth, width, max_channels]
  l: [1.00, 1.00, 1024]
 
backbone:
  # [from, repeats, module, args]
  - [-1, 1, ConvNormLayer, [32, 3, 2, 1, 'relu']] # 0-P1
  - [-1, 1, ConvNormLayer, [32, 3, 1, 1, 'relu']] # 1
  - [-1, 1, ConvNormLayer, [64, 3, 1, 1, 'relu']] # 2
  - [-1, 1, nn.MaxPool2d, [3, 2, 1]] # 3-P2

  - [-1, 2, Blocks, [64,  BasicBlock_MSDA, 2, True]] # 4
  - [-1, 2, Blocks, [128, BasicBlock_MSDA, 3, True]] # 5-P3
  - [-1, 2, Blocks, [256, BasicBlock_MSDA, 4, True]] # 6-P4
  - [-1, 2, Blocks, [512, BasicBlock_MSDA, 5, True]] # 7-P5
 
head:
  - [-1, 1, Conv, [256, 1, 1, None, 1, 1, False]]  # 8 input_proj.2
  - [-1, 1, AIFI_DF, [1024, 8, 4, 2]]  # 9

  - [5, 1, Conv, [256]]  # 10-P3/8
  - [6, 1, Conv, [256]]  # 11-P4/16
  - [9, 1, Conv, [256]]  # 12-P5/32

  - [-1, 1, Dy_Sample, []]  # 13
  - [[-1, 11], 1, Bi_FPN, []]  # 14
  - [-1, 3, DFAL2, [256]]  # 15

  - [-1, 1, Dy_Sample, []]  # 16
  - [[-1, 10], 1, Bi_FPN, []]  # 17
  - [-1, 3, DFAL2, [256]]  # 18

  - [4, 1, Conv, [256, 3, 2]] # 19 P2->P3
  - [[-1, 10, 18], 1, Bi_FPN, []] # 20
  - [-1, 3, DFAL2, [256]]  # 21   -----P3

  - [-1, 1, Conv, [256, 3, 2]] # 22 P3->P4
  - [[-1, 11, 15], 1, Bi_FPN, []] # 23
  - [-1, 3, DFAL2, [256]]  # 24   -----P4

  - [-1, 1, Conv, [256, 3, 2]] # 25 P4->P5
  - [[-1, 12], 1, Bi_FPN, []] # 26
  - [-1, 3, DFAL2, [256]]  # 27   -----P5

  - [[21, 24, 27], 1, RTDETRDecoder, [nc, 256, 300, 4, 8, 3]]  # Detect(P3, P4, P5)
